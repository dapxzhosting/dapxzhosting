<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" role="img" aria-label="Code it. Ship it. Polish it." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#deddd6"/>
      <stop offset="1" stop-color="#f7f6f2"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#050507" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#050507" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="100" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="100" fill="url(#bg)"/>
    <rect x="300" y="26" width="600" height="2" fill="url(#line)"/>
    <text x="600" y="64" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="18" fill="#55545c">Code it. Ship it. Polish it.</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
