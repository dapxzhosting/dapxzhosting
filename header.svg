<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-label="Dafa Alfiansyah - Full-Stack and Android Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050507"/>
      <stop offset="1" stop-color="#23232b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EDEBE6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#EDEBE6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#EDEBE6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EDEBE6" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0" stop-color="#EDEBE6" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#EDEBE6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="240" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="240" fill="url(#bg)"/>
    <rect width="1200" height="240" fill="url(#grid)"/>
    <rect width="1200" height="240" fill="url(#glow)"/>

    <text x="40" y="52" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="16" fill="#EDEBE6" fill-opacity="0.35">&lt;/&gt;</text>
    <text x="1160" y="52" text-anchor="end" font-family="'Fira Code','JetBrains Mono',Consolas,monospace" font-size="16" fill="#EDEBE6" fill-opacity="0.35">{ Kotlin · React · Laravel }</text>

    <text x="600" y="118" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="56" font-weight="700" fill="#EDEBE6">Dafa Alfiansyah</text>
    <text x="600" y="162" text-anchor="middle" font-family="'Fira Code','JetBrains Mono',Consolas,'Courier New',monospace" font-size="22" fill="#9b9aa3">Full-Stack Developer  ·  Android Developer</text>

    <rect x="300" y="186" width="600" height="2" fill="url(#line)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
